name: Web research validation

on:
  pull_request:
    paths:
      - "src/services/web-research.ts"
      - "src/services/ai.ts"
      - "tests/web-research.test.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/web-research.yml"
  push:
    branches:
      - "feature/web-research-search-upgrade"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build TypeScript
        run: npm run build
