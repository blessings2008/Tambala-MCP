name: Organization foundation checks

on:
  push:
    branches:
      - main
      - org-platform-redesign
      - org-capability-routing
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - feature/**
      - fix/**

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check and build
        run: npm run build
      - name: Run organization tests
        run: npm test
