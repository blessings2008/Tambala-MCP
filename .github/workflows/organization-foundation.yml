name: Organization foundation checks

on:
  push:
    branches:
      - org-platform-redesign
      - org-task-engine
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Type-check and build
        run: npm run build
      - name: Run organization tests
        run: npm test
