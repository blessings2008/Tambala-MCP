name: Tambala duty runner

on:
  schedule:
    - cron: '0 6 * * *'
      timezone: Africa/Blantyre
    - cron: '5 6 * * *'
      timezone: Africa/Blantyre
    - cron: '10 6 * * *'
      timezone: Africa/Blantyre
    - cron: '15 6 * * *'
      timezone: Africa/Blantyre
    - cron: '20 6 * * *'
      timezone: Africa/Blantyre
    - cron: '30 7 * * *'
      timezone: Africa/Blantyre
    - cron: '35 7 * * *'
      timezone: Africa/Blantyre
    - cron: '40 7 * * *'
      timezone: Africa/Blantyre
    - cron: '45 7 * * *'
      timezone: Africa/Blantyre
    - cron: '50 7 * * *'
      timezone: Africa/Blantyre
    - cron: '0 8 * * 1-5'
      timezone: Africa/Blantyre
    - cron: '5 8 * * 1-5'
      timezone: Africa/Blantyre
    - cron: '10 8 * * 1-5'
      timezone: Africa/Blantyre
    - cron: '15 8 * * 1-5'
      timezone: Africa/Blantyre
    - cron: '20 8 * * 1-5'
      timezone: Africa/Blantyre
    - cron: '25 8 * * 1-5'
      timezone: Africa/Blantyre
    - cron: '30 8 * * 1-5'
      timezone: Africa/Blantyre
    - cron: '0 9 * * 1-5'
      timezone: Africa/Blantyre
    - cron: '30 9 * * 1-5'
      timezone: Africa/Blantyre
    - cron: '0 10 * * 1-5'
      timezone: Africa/Blantyre
    - cron: '30 10 * * 1-5'
      timezone: Africa/Blantyre
    - cron: '0 14 * * 5'
      timezone: Africa/Blantyre
    - cron: '0 15 * * 5'
      timezone: Africa/Blantyre
    - cron: '30 16 * * 1-5'
      timezone: Africa/Blantyre
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tambala-duty-runner
  cancel-in-progress: false

jobs:
  run-due-duties:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify scheduler secret and service health
        env:
          TAMBALA_SCHEDULER_TOKEN: ${{ secrets.TAMBALA_SCHEDULER_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${TAMBALA_SCHEDULER_TOKEN}" ]]; then
            echo "::error::TAMBALA_SCHEDULER_TOKEN is not configured in GitHub repository secrets."
            exit 1
          fi
          curl --fail --silent --show-error --retry 2 --retry-delay 5 --retry-all-errors --max-time 75 \
            https://tambala-org.onrender.com/health

      - name: Trigger due organization duties
        env:
          TAMBALA_SCHEDULER_TOKEN: ${{ secrets.TAMBALA_SCHEDULER_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          echo "Calling Tambala duty runner and waiting for the full duty cycle."
          http_code="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' --max-time 300 \
            --request POST \
            --header "Authorization: Bearer ${TAMBALA_SCHEDULER_TOKEN}" \
            --header "Content-Type: application/json" \
            --data '{}' \
            https://tambala-org.onrender.com/api/duties/run || true)"
          cat "$response_file" || true
          if [[ "${http_code}" =~ ^2[0-9][0-9]$ ]]; then
            echo "Duty cycle completed and the service returned HTTP ${http_code}."
            exit 0
          fi
          echo "::error::Tambala duty runner returned HTTP ${http_code:-000} or exceeded the 300-second request limit."
          exit 1
