name: Tambala Duty Runner

on:
  schedule:
    # Africa/Blantyre is UTC+2. Includes 04:00 UTC for the 06:00 Malawi daily research duty, including weekends.
    - cron: "*/5 4-15 * * *"
  workflow_dispatch:
    inputs:
      run_duties:
        description: "Run due duties now (may execute approved operational actions)"
        required: true
        default: false
        type: boolean

concurrency:
  group: tambala-duty-runner
  cancel-in-progress: false

jobs:
  run-due-duties:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify scheduler secret is configured
        env:
          SCHEDULER_TOKEN: ${{ secrets.TAMBALA_SCHEDULER_TOKEN }}
        run: |
          if [ -z "$SCHEDULER_TOKEN" ]; then
            echo "::error::TAMBALA_SCHEDULER_TOKEN is not configured in GitHub Actions secrets."
            exit 1
          fi

      - name: Check Tambala service health
        run: |
          curl --fail --silent --show-error --retry 2 --retry-delay 5 --retry-all-errors --max-time 45 \
            https://tambala-org.onrender.com/health

      - name: Run duties due in Africa/Blantyre
        if: github.event_name == 'schedule' || inputs.run_duties == true
        env:
          SCHEDULER_TOKEN: ${{ secrets.TAMBALA_SCHEDULER_TOKEN }}
        run: |
          curl --fail --silent --show-error --retry 2 --retry-delay 5 --retry-all-errors --max-time 180 \
            -X POST https://tambala-org.onrender.com/api/duties/run \
            -H "Authorization: Bearer $SCHEDULER_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{}'
